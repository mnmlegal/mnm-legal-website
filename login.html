<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MNM Admin Login</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: "Poppins", sans-serif;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 380px;
      background: #111;
      padding: 40px;
      border: 1px solid #d4af37;
      border-radius: 15px;
      text-align: center;
      box-shadow: 0 0 25px rgba(212, 175, 55, 0.15);
    }

    .login-box img {
      width: 90px;
      margin-bottom: 20px;
    }

    .login-box h2 {
      color: #d4af37;
      margin-bottom: 30px;
      font-size: 26px;
    }

    .login-box input {
      width: 100%;
      padding: 14px;
      margin: 10px 0;
      background: #222;
      border: 1px solid #444;
      color: #fff;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
    }

    .login-box input:focus {
      border-color: #d4af37;
    }

    .login-box button {
      width: 100%;
      padding: 15px;
      margin-top: 14px;
      background: #d4af37;
      color: #000;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
    }

    .login-box button:hover {
      background: #f0c94b;
    }

    .login-box button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #error {
      color: #ff4d4d;
      margin-top: 15px;
      font-size: 14px;
      min-height: 20px;
    }

    #success {
      color: #4dff88;
      margin-top: 15px;
      font-size: 14px;
      min-height: 20px;
    }

    @media (max-width: 480px) {
      .login-box {
        padding: 30px 22px;
      }

      .login-box h2 {
        font-size: 22px;
      }
    }
  </style>
</head>

<body>

  <div class="login-box">

    <img
      src="images/logo.png"
      alt="MNM Legal Associates Logo"
    >

    <h2>MNM Admin Panel</h2>

    <input
      type="text"
      id="username"
      placeholder="Username or Email"
      autocomplete="username"
    >

    <input
      type="password"
      id="password"
      placeholder="Password"
      autocomplete="current-password"
    >

    <button
      type="button"
      id="loginBtn"
    >
      LOGIN
    </button>

    <p id="error"></p>
    <p id="success"></p>

  </div>


  <script>

    /* =========================================================
       SUPABASE CONFIGURATION
       ========================================================= */

    const SUPABASE_URL = "PASTE_YOUR_SUPABASE_PROJECT_URL_HERE";

    const SUPABASE_ANON_KEY = "PASTE_YOUR_SUPABASE_ANON_OR_PUBLISHABLE_KEY_HERE";


    /* =========================================================
       CREATE SUPABASE CLIENT
       ========================================================= */

    const { createClient } = window.supabase;

    const supabaseClient = createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );


    /* =========================================================
       ELEMENTS
       ========================================================= */

    const usernameInput = document.getElementById("username");
    const passwordInput = document.getElementById("password");
    const loginBtn = document.getElementById("loginBtn");

    const errorMessage = document.getElementById("error");
    const successMessage = document.getElementById("success");


    /* =========================================================
       ADMIN EMAIL
       
       Your Supabase admin account:
       mnmlegal.in@gmail.com
       ========================================================= */

    const ADMIN_EMAIL = "mnmlegal.in@gmail.com";


    /* =========================================================
       CLEAR MESSAGES
       ========================================================= */

    function clearMessages() {
      errorMessage.textContent = "";
      successMessage.textContent = "";
    }


    /* =========================================================
       LOGIN FUNCTION
       ========================================================= */

    async function login() {

      clearMessages();

      const username = usernameInput.value.trim();
      const password = passwordInput.value;

      if (!username || !password) {

        errorMessage.textContent =
          "Please enter username and password.";

        return;
      }


      /*
       Allow both:

       mnmlegal

       OR

       mnmlegal.in@gmail.com
      */

      let email = username;

      if (username.toLowerCase() === "mnmlegal") {
        email = ADMIN_EMAIL;
      }


      loginBtn.disabled = true;
      loginBtn.textContent = "LOGGING IN...";


      try {

        /* =====================================================
           SUPABASE AUTHENTICATION
           ===================================================== */

        const { data, error } =
          await supabaseClient.auth.signInWithPassword({

            email: email,

            password: password

          });


        if (error) {

          console.error("Login error:", error);

          errorMessage.textContent =
            "Invalid username or password.";

          loginBtn.disabled = false;
          loginBtn.textContent = "LOGIN";

          return;
        }


        /* =====================================================
           CHECK USER
           ===================================================== */

        const user = data.user;


        if (!user) {

          errorMessage.textContent =
            "Unable to verify account.";

          loginBtn.disabled = false;
          loginBtn.textContent = "LOGIN";

          return;
        }


        /* =====================================================
           CHECK ADMIN ROLE
           ===================================================== */

        const {
          data: profile,
          error: profileError
        } = await supabaseClient

          .from("profiles")

          .select("role")

          .eq("id", user.id)

          .single();


        if (profileError) {

          console.error(
            "Profile error:",
            profileError
          );

          await supabaseClient.auth.signOut();

          errorMessage.textContent =
            "Unable to verify admin access.";

          loginBtn.disabled = false;
          loginBtn.textContent = "LOGIN";

          return;
        }


        /* =====================================================
           ADMIN ONLY
           ===================================================== */

        if (!profile || profile.role !== "admin") {

          await supabaseClient.auth.signOut();

          errorMessage.textContent =
            "Access denied. Admin account required.";

          loginBtn.disabled = false;
          loginBtn.textContent = "LOGIN";

          return;
        }


        /* =====================================================
           SUCCESS
           ===================================================== */

        successMessage.textContent =
          "Login successful. Opening Admin Panel...";


        /*
         IMPORTANT:

         We DO NOT use:

         localStorage.setItem("loggedIn", "yes")

         Supabase itself maintains the authenticated session.
        */


        setTimeout(() => {

          window.location.href = "dashboard.html";

        }, 500);


      } catch (err) {

        console.error(err);

        errorMessage.textContent =
          "Something went wrong. Please try again.";

        loginBtn.disabled = false;
        loginBtn.textContent = "LOGIN";

      }

    }


    /* =========================================================
       LOGIN BUTTON
       ========================================================= */

    loginBtn.addEventListener(
      "click",
      login
    );


    /* =========================================================
       ENTER KEY
       ========================================================= */

    document.addEventListener(
      "keydown",
      function(event) {

        if (event.key === "Enter") {

          login();

        }

      }
    );


    /* =========================================================
       CHECK EXISTING SESSION
       
       If already logged in, don't show login again.
       ========================================================= */

    async function checkExistingSession() {

      try {

        const {
          data: {
            session
          }
        } = await supabaseClient.auth.getSession();


        if (!session) {
          return;
        }


        const user = session.user;


        /* Check admin role */

        const {
          data: profile,
          error
        } = await supabaseClient

          .from("profiles")

          .select("role")

          .eq("id", user.id)

          .single();


        if (
          !error &&
          profile &&
          profile.role === "admin"
        ) {

          window.location.href =
            "dashboard.html";

        }

      } catch (err) {

        console.error(
          "Session check error:",
          err
        );

      }

    }


    /* Run session check */

    checkExistingSession();

  </script>

</body>
</html>
