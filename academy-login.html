<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Student Login | MNM Academy</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="academy.css"></head>
<body class="academy-page"><nav class="academy-nav"><a class="academy-brand" href="academy.html"><img src="images/logo.png" alt="MNM Academy"><span><strong>MNM Academy</strong><span>Secure student access</span></span></a><div class="academy-nav-links"><a href="academy.html">Courses</a><a href="index.html">Main Site</a></div></nav>
<main class="academy-shell"><div class="academy-form-wrap academy-panel"><h1>Welcome to MNM Academy</h1><p class="academy-note">Students create their own account. Academy administrators use a separate protected administrator account.</p><div class="academy-tabs"><button class="academy-tab active" data-academy-tab="login">Login</button><button class="academy-tab" data-academy-tab="signup">Create account</button><button class="academy-tab" data-academy-tab="forgot">Reset password</button></div><div id="academyAuthMessage" class="academy-message"></div>
<form id="academyLoginForm" data-academy-panel="login"><div class="academy-field"><label>Email address</label><input name="email" type="email" required autocomplete="email"></div><div class="academy-field"><label>Password</label><input name="password" type="password" required autocomplete="current-password"></div><button class="academy-button" type="submit">Log in securely</button></form>
<form id="academySignupForm" data-academy-panel="signup" class="academy-hidden"><div class="academy-field"><label>Full name</label><input name="fullName" required autocomplete="name"></div><div class="academy-field"><label>Mobile number</label><input name="mobile" type="tel" required autocomplete="tel"></div><div class="academy-field"><label>Email address</label><input name="email" type="email" required autocomplete="email"></div><div class="academy-field"><label>Create password</label><input name="password" type="password" minlength="8" required autocomplete="new-password"></div><button class="academy-button" type="submit">Create student account</button></form>
<form id="academyForgotForm" data-academy-panel="forgot" class="academy-hidden"><div class="academy-field"><label>Email address</label><input name="email" type="email" required autocomplete="email"></div><button class="academy-button" type="submit">Send reset link</button></form>
<p class="academy-note" style="margin-top:22px">Administrator? <a href="academy-admin.html" style="color:#d4af37">Log in as an admin</a></p></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="academy-config.js"></script><script src="academy.js"></script></body></html>
